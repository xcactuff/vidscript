[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidscript"
version = "0.1.0"
description = "Turn a narration script into timed scenes, subtitles and a shot list."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["youtube", "subtitles", "srt", "script", "video", "shot-list"]
authors = [{ name = "Fernando Garcia Villaraco" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
icon = ["pillow>=10"]
build-app = ["pyinstaller>=6"]

[project.scripts]
vidscript = "vidscript.cli:main"

[project.gui-scripts]
vidscript-gui = "vidscript.gui:main"

[project.urls]
Homepage = "https://github.com/xcactuff/vidscript"
Issues = "https://github.com/xcactuff/vidscript/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vidscript"]
artifacts = ["src/vidscript/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
